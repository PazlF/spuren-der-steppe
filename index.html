 },

 },

  <script>
document.addEventListener('DOMContentLoaded',()=>{
'use strict';
const pack=window.SKYTHEN_PACK;
const labData=window.SKYTHEN_DETAILS||{};
const root=document.querySelector('#app');
if(!pack||!root){document.body.textContent='Inhaltspaket fehlt.';return;}
const byId=Object.fromEntries(pack.objects.map(o=>[o.id,o]));
const editorMode=new URLSearchParams(window.location.search).get('kalibrieren')==='1';
const strictOffline=new URLSearchParams(window.location.search).get('offline')==='1';
// Anonyme lokale Pilotstatistik: aggregierte Zähler, keine Besucherkennungen oder Netzwerkanfragen.
const ANALYTICS_KEY='spuren-steppe-pilot-v1';
const PILOT_ENABLED_KEY='spuren-steppe-pilot-enabled';
let pilotEnabled=false;try{pilotEnabled=localStorage.getItem(PILOT_ENABLED_KEY)==='yes';}catch(e){}
function emptyStats(){return {version:1,starts:0,completed:0,abandoned:0,idleResets:0,byObject:{},feedback:{klar:0,teilweise:0,unklar:0},stepVisits:{},lastUpdate:null};}
let stats;
try {stats=JSON.parse(localStorage.getItem(ANALYTICS_KEY))||emptyStats();}catch(e){stats=emptyStats();}
let activeVisit=null;
function recordSave(){if(!pilotEnabled)return;stats.lastUpdate=new Date().toISOString();try{localStorage.setItem(ANALYTICS_KEY,JSON.stringify(stats));}catch(e){}}
function objStats(id){return stats.byObject[id]||(stats.byObject[id]={starts:0,complete:0,aborts:0,secondsTotal:0,feedback:{klar:0,teilweise:0,unklar:0}});}
function visitStart(id){if(!pilotEnabled)return;if(activeVisit&&activeVisit.id===id)return;if(activeVisit)visitAbort();activeVisit={id,start:Date.now(),feedbackGiven:false};stats.starts++;objStats(id).starts++;recordSave();}
function visitAbort(){if(!activeVisit)return;stats.abandoned++;objStats(activeVisit.id).aborts++;activeVisit=null;recordSave();}
function visitComplete(){if(!activeVisit)return;stats.completed++;const st=objStats(activeVisit.id);st.complete++;st.secondsTotal+=Math.max(0,Math.min(3600,Math.round((Date.now()-activeVisit.start)/1000)));activeVisit=null;recordSave();}
function stepMark(page){if(!activeVisit)return;const key=activeVisit.id+':'+page;stats.stepVisits[key]=(stats.stepVisits[key]||0)+1;recordSave();}
function feedbackRecord(id,answer){if(!pilotEnabled)return;if(!['klar','teilweise','unklar'].includes(answer)||!id)return;stats.feedback[answer]++;objStats(id).feedback[answer]++;recordSave();}
function statsExport(){const blob=new Blob([JSON.stringify(stats,null,2)],{type:'application/json'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download='spuren-der-steppe-anonyme-auswertung.json';a.click();setTimeout(()=>URL.revokeObjectURL(href),1000);}
function pilotDashboard(){const pct=(a,b)=>b?Math.round(100*a/b)+' %':'–';return `<div class="pilot-dashboard"><h2>Besucher-Testmodus · nur auf diesem Gerät</h2><p>Aggregierte Nutzungszahlen ohne Namen, IP-Adressen, Nutzerkennungen oder Serverübertragung. Besuche gelten als abgebrochen, wenn eine Station vor dem Fundbericht verlassen wird. Bearbeitungszeiten messen Zeit bis zum Fundbericht einschließlich möglicher Pausen.</p><div class="pilot-kpis"><div><b>${stats.starts}</b><span>Stationsstarts</span></div><div><b>${stats.completed}</b><span>Abschlüsse</span></div><div><b>${pct(stats.completed,stats.starts)}</b><span>Abschlussquote</span></div><div><b>${stats.abandoned}</b><span>Abbrüche</span></div></div><div class="pilot-table"><table><thead><tr><th>Fundstück</th><th>Starts</th><th>Fertig</th><th>Abbruch</th><th>Ø Dauer</th><th>Verständlich</th></tr></thead><tbody>${pack.objects.map(o=>{const v=objStats(o.id);return `<tr><td>${esc(o.short)}</td><td>${v.starts}</td><td>${v.complete}</td><td>${v.aborts}</td><td>${v.complete?Math.round(v.secondsTotal/v.complete)+' s':'–'}</td><td>${v.feedback.klar}/${v.feedback.teilweise}/${v.feedback.unklar}</td></tr>`}).join('')}</tbody></table></div><p>Feedback-Reihenfolge: Ja / Teilweise / Nein. Die Daten sind nur lokal gespeichert und können durch Browserdaten-Löschung verschwinden. Nicht als repräsentative Lernwirkungsmessung interpretieren.</p><div class="pilot-actions"><button class="btn btn-outline" data-action="pilot-export">Daten als JSON exportieren</button><button class="btn btn-outline" data-action="pilot-reset">Lokale Testdaten löschen</button><button class="btn btn-outline" data-action="pilot-close">Auswertung schließen</button></div></div>`;}
let showPilot=false;

const state={shortMode:true,page:'gallery',objectId:null,selected:[],checked:false,done:new Set(),zoom:1,x:0,y:0,showHint:false,showSources:false,labView:'photo',activeSpot:null,discovered:{},photoPoint:null,calibrateSpot:0,hotspotsVisible:true,comparePick:[0,1],compareNote:false,fieldAnswer:null,fieldChecked:false,fieldDocument:null};
let inactivityTimer=null,lastPointer=null;
const pointers=new Map(); let touchMoved=false,gestureStart=null;
const localPhotos=Object.create(null);
let photoDbPromise=null;
function photoDB(){
 if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB nicht verfügbar'));
 if(!photoDbPromise) photoDbPromise=new Promise((resolve,reject)=>{
  const r=indexedDB.open('spuren-der-steppe-originalbilder',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('images'))r.result.createObjectStore('images')};
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
 return photoDbPromise;
}
function photoSrc(o){return localPhotos[o.id] || o.imageLocal;}
function registerPhoto(oId,blob){if(localPhotos[oId]?.startsWith('blob:'))URL.revokeObjectURL(localPhotos[oId]);localPhotos[oId]=URL.createObjectURL(blob);}
async function loadLocalPhotos(){try{
 const db=await photoDB();const tr=db.transaction('images','readonly');const store=tr.objectStore('images');
 for(const o of pack.objects){const blob=await new Promise(res=>{const r=store.get(o.id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)});if(blob)registerPhoto(o.id,blob)}
 render();
 }catch(e){/* Browsers without IndexedDB still load museum URLs */}}
async function saveLocalPhoto(oId,file){const db=await photoDB();await new Promise((resolve,reject)=>{const tr=db.transaction('images','readwrite');tr.objectStore('images').put(file,oId);tr.oncomplete=resolve;tr.onerror=()=>reject(tr.error)});registerPhoto(oId,file);render()}
window.metPhotoLoaded=(img)=>{
 const frame=img.closest('.art-frame');if(frame){frame.classList.add('is-loaded');frame.classList.remove('not-loaded')}
 if(img.closest('#photo-frame')){const canvas=img.closest('#lab-canvas');canvas?.classList.remove('photo-error');fitPhoto();}
};
window.metPhotoError=(img)=>{
 const id=img.dataset.object;const o=byId[id];if(!o)return;
 if(!strictOffline && img.dataset.stage!=='remote' && img.src!==o.image){img.dataset.stage='remote';img.src=o.image;return;}
 const frame=img.closest('.art-frame');if(frame)frame.classList.add('not-loaded');
 const canvas=img.closest('#lab-canvas');if(canvas)canvas.classList.add('photo-error');
};
function fitPhoto(){
 const canvas=document.querySelector('#lab-canvas');const frame=document.querySelector('#photo-frame');const img=frame?.querySelector('img');
 if(!canvas||!frame||!img?.naturalWidth)return;
 const cw=canvas.clientWidth,ch=canvas.clientHeight;
 const scale=Math.min(cw/img.naturalWidth,ch/img.naturalHeight);
 frame.style.width=`${Math.round(img.naturalWidth*scale)}px`;
 frame.style.height=`${Math.round(img.naturalHeight*scale)}px`;
 frame.classList.add('photo-ready');
}
window.addEventListener('resize',fitPhoto);

const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const me=()=>byId[state.objectId];
const progress=()=>`${state.done.size} / ${pack.objects.length}`;
const museum=pack.exhibition;
function resets(){state.selected=[];state.checked=false;state.zoom=1;state.x=0;state.y=0;state.showHint=false;state.showSources=false;state.labView='photo';state.activeSpot=null;state.photoPoint=null;state.calibrateSpot=0;state.fieldAnswer=null;state.fieldChecked=false;state.fieldDocument=null;pointers.clear();gestureStart=null;}
function go(page,id){if(page==='shortfinish'){visitComplete();state.done.add(state.objectId);page='report';}if(page==='object' && id)visitStart(id);else if(activeVisit && ['gallery','about','final'].includes(page))visitAbort();if(id)state.objectId=id;state.page=page;stepMark(page);resets();render();window.scrollTo({top:0,behavior:'instant'});}
function restart(){if(activeVisit)visitAbort();state.done.clear();state.discovered={};state.objectId=null;go('gallery');}
function idle(){clearTimeout(inactivityTimer);inactivityTimer=setTimeout(()=>{if(pilotEnabled){stats.idleResets++;recordSave();}restart();},Math.max(8,Number(museum.idleMinutes)||8)*60000)}
['pointerdown','keydown','wheel','touchstart'].forEach(name=>window.addEventListener(name,idle,{passive:true}));idle();
function logo(){return `<span class="sigil" aria-hidden="true"><svg viewBox="0 0 46 46"><path d="M8 34L16 12L24 24L32 12L39 34Z M14 34H36 M23 24V36"/></svg></span>`}
function masthead(){return `<header class="masthead"><button class="brand" data-action="home" aria-label="Zur Sammlung">${logo()}<span class="brand-text"><strong>SPUREN DER STEPPE</strong><small>ENTDECKEN · SPIELEN · FORSCHEN</small></span></button><div class="masthead-right"><span class="tiny-maker">KONZEPT & ENTWICKLUNG <b>${esc(museum.maker)}</b></span><button class="icon-circle" data-action="about" aria-label="Über das Projekt und Quellen">i</button></div></header>`}
function footer(){return `<footer class="footer"><span><i class="dot"></i> ${esc(museum.museumName)} · Forschungsbasierter Prototyp</span><span>Eine Arbeit von <strong>${esc(museum.maker)}</strong></span><button class="text-button" data-action="about">Impressum & Quellen ↗</button></footer>`}
function thumb(o,size='card'){return `<div class="art-frame art-${size}" data-art="${esc(o.id)}"><img class="art-original" src="${esc(photoSrc(o))}" data-object="${o.id}" data-stage="local" alt="Originalfoto: ${esc(o.short)} · The Metropolitan Museum of Art" loading="${size==='hero'?'eager':'lazy'}" onload="window.metPhotoLoaded(this)" onerror="window.metPhotoError(this)"><span class="art-offline">Originalfoto noch nicht geladen · Fundstück öffnen</span><span class="art-stamp">${size==='card'?'MET · '+esc(o.inventory):'THE MET · ORIGINALFOTOGRAFIE'}</span></div>`}
function ornament(){return `<span class="ornament-line" aria-hidden="true">◈ <span>───</span> ◈ <span>───</span> ◈</span>`}
function gallery(){let all=state.done.size===pack.objects.length;
return `${masthead()}<main class="main main-gallery modern-gallery">
  <section class="hero museum-hero"><div class="hero-copy"><span class="eyebrow"><span class="eyebrow-line"></span> DEINE DIGITALE AUSSTELLUNG</span><h1>SPUREN <em>DER STEPPE.</em></h1><p class="hero-lead">Sieben echte Fundstücke. Sieben kleine Abenteuer.</p><p class="hero-intro">Schau genau hin, entdecke verborgene Details und löse die Rätsel der Archäologie.</p><div class="hero-actions"><button class="btn btn-gold primary-cta" data-action="open" data-id="hirsch">Jetzt entdecken <span>→</span></button><button class="btn btn-outline quiet-cta" data-action="go-collection">Fundstücke auswählen ↓</button></div></div><div class="mode-choice" role="group" aria-label="Spieltempo wählen"><span>Wie möchtest du spielen?</span><button class="mode-chip ${state.shortMode?'selected':''}" data-action="mode-short" aria-pressed="${state.shortMode}">⚡ Kurz spielen</button><button class="mode-chip ${!state.shortMode?'selected':''}" data-action="mode-long" aria-pressed="${!state.shortMode}">⌕ Alles entdecken</button><small>${state.shortMode?'Eine kurze Mission pro Fundstück.':'Mit Fotovergleich, Wissensfragen und Quellenprüfung.'}</small></div></div><div class="hero-visual">${thumb(pack.objects[0],'hero')}<div class="hero-visual-caption"><span>ORIGINALFUND · 5. JH. V. CHR.</span><strong>DER GOLDHIRSCH</strong></div></div></section>
  <section class="three-tips" aria-label="In drei Schritten spielen"><div><b>1</b><span>Fundstück wählen</span></div><div><b>2</b><span>Details antippen</span></div><div><b>3</b><span>Rätsel lösen</span></div></section>
  <section class="collection-intro" id="sammlung"><div><span class="kicker">DEINE ENTDECKUNGSREISE</span><h2>Welche Vitrine <em>zuerst?</em></h2><p>Tippe auf ein Fundstück und leg los – jetzt mit Ausgrabungsmission, Fundlabor und Originalfotos.</p></div><div class="collection-progress"><div class="progress-number">${progress()}</div><div class="progress-sub">ENTDECKT</div><div class="progress-track"><span style="width:${state.done.size/pack.objects.length*100}%"></span></div></div></section>
  <section class="sort-invite" style="background:linear-gradient(120deg,#304336,#172820);border-color:#c99e60"><div><span class="kicker">NEU · TOUCH-MISSION 03</span><h2>Archäologie im Befundlabor</h2><p>Markiere drei Fundlagen auf einem digitalen Grabungsraster, dokumentiere sie und prüfe deine Schlussfolgerungen.</p></div><button type="button" class="btn btn-gold" onclick="window.openBefundlabor()">Befundlabor starten →</button></section>
  <section class="journey-invite"><div><span class="kicker">NEU · ZUSAMMENHÄNGENDES TOUCH-ABENTEUER</span><h2>Deine Forschungsreise</h2><p>Wähle eines von sieben Fundstücken und durchlaufe vier Etappen: freilegen, dokumentieren, untersuchen und Forschungsbericht erstellen.</p></div><button type="button" class="btn btn-gold" onclick="window.openForschungsreise()">Forschungsreise starten →</button></section>
  <section class="sort-invite"><div><span class="kicker">NEUES TOUCH-SPIEL</span><h2>Ordne die Funde zu!</h2><p>Ziehe echte Fundfotos zu ihrer vermuteten Verwendung. Oder wähle sie mit einem Tipp aus.</p></div><button type="button" class="btn btn-gold" onclick="window.openFundlabor()">Fundlabor spielen →</button></section>
  <section class="object-grid" aria-label="Sieben Fundstücke">${pack.objects.map(o=>`<button class="object-card ${state.done.has(o.id)?'explored':''}" data-action="open" data-id="${esc(o.id)}" aria-label="${esc(o.short)} erkunden"><div class="card-upper"><span class="card-number">${o.n} <span>/ 07</span></span><span class="card-state">${state.done.has(o.id)?'✓ Geschafft':'Entdecken →'}</span></div>${thumb(o)}<div class="card-details"><span class="card-topic">${esc(o.section)}</span><h3>${esc(o.short)}</h3><p>${esc(o.material)}</p><div class="card-bottom"><span>${esc(o.badge)}</span><strong>Spielen →</strong></div></div></button>`).join('')}</section>
  ${all?`<div class="all-done"><span class="kicker">ALLE FUNDSTÜCKE ENTDECKT</span><h2>Ausgezeichnet geforscht!</h2><button class="btn btn-gold" data-action="final">Fundbericht ansehen →</button></div>`:''}
  <section class="principle"><div class="principle-icon">?</div><div><span class="kicker">ARCHÄOLOGIE LIVE</span><h3>Was wissen wir wirklich?</h3><p>Im Spiel entdeckst du, was durch Funde belegt ist – und wo die Forschung noch Fragen hat.</p></div><button class="btn btn-outline" data-action="about">Zu den Quellen ↗</button></section>
</main>${footer()}`}
function steps(active){return `<div class="stepper" aria-label="Fortschritt dieser Station"><span class="${active>=0?'active':''}">01 <b>BETRACHTEN</b></span><i></i><span class="${active>=1?'active':''}">02 <b>ANFASSEN</b></span><i></i><span class="${active>=2?'active':''}">03 <b>PRÜFEN</b></span><i></i><span class="${active>=3?'active':''}">04 <b>EINORDNEN</b></span></div>`}
function stationTop(o,step){return `${masthead()}<main class="main station-main"><nav class="breadcrumbs"><button data-action="home">← Zur Sammlung</button><span>/</span><span>EXPONAT ${o.n}</span><span>/</span><b>${esc(o.section)}</b></nav><div class="station-title-row"><div><span class="kicker">FUNDSTÜCK ${o.n} / 07 · ${esc(o.kind)}</span><h1>${esc(o.title)}</h1></div><div class="index-stamp">${o.n}<span> / 07</span></div></div>${steps(step)}<div class="station-mode"><span>${state.shortMode?'⚡ Kurzer Spielweg':'⌕ Ausführlicher Forschungsweg'}</span><span>${state.shortMode?'Foto ansehen → Mission → Fertig':'Foto → Vergleich → Mission → Fragen'}</span></div>`}
function museumTag(o){return `<div class="museum-tag"><div class="tag-mark">✧</div><div><strong>${esc(o.museum)}</strong><small>Inv. ${esc(o.inventory)} · ${esc(o.era)}</small></div></div>`}

 if(state.page!=='excavation')return;
 const stage=root.querySelector('#excavation-stage'),canvas=root.querySelector('#excavation-canvas');if(!stage||!canvas)return;
 const bounds=stage.getBoundingClientRect();const width=Math.max(1,Math.round(bounds.width)),height=Math.max(1,Math.round(bounds.height));
 canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');if(!ctx)return;

 root.querySelectorAll('.exc-tool').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.excTool)));
 setTool('spatel');
 function drawSoil(){

  let seed=31;const random=()=>{seed=(seed*1103515245+12345)%2147483647;return(seed&2147483647)/2147483647};
  for(let i=0;i<1100;i++){ctx.globalAlpha=.10+random()*.18;ctx.fillStyle=random()>.5?'#eed19b':'#5a432c';ctx.beginPath();ctx.arc(random()*width,random()*height,random()*4.6+.5,0,Math.PI*2);ctx.fill();}

 }

 function mark(x,y,radius){const cx=Math.floor(x/width*26),cy=Math.floor(y/height*20);const rr=Math.max(1.25,radius*26/width);for(let yy=Math.max(0,cy-4);yy<=Math.min(19,cy+7);yy++)for(let xx=Math.max(0,cx-4);xx<=Math.min(25,cx+7);xx++)if(Math.hypot(xx-cx,yy-cy)<rr)pixels[yy*26+xx]=1;const pct=Math.round(ratio()*100);progressLabel.textContent=pct+' % freigelegt';progressBar.style.width=pct+'%';if(pct>=24&&!spatelUsed){spatelUsed=true;}if(pct>=22&&currentTool==='spatel'){step1Note.textContent='Gut. Die obere Schicht ist abgetragen. Wechsle jetzt zum Pinsel.';hint.textContent='Jetzt auf Pinsel wechseln';}

 function erase(e){const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;const rad=currentTool==='spatel'?Math.min(width,height)*.11:Math.min(width,height)*.072;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation='source-over';mark(x,y,rad);if(currentTool==='spatel'&&ratio()>0.42){step1Note.textContent='Etwas vorsichtiger: Für feinere Arbeit jetzt lieber den Pinsel nehmen.';}}
 canvas.addEventListener('pointerdown',e=>{if(phase!==1)return;e.preventDefault();excavationPointer=e.pointerId;canvas.setPointerCapture(e.pointerId);hint.hidden=true;erase(e)});

 docBtn.addEventListener('click',()=>{if(!docReady)return;docDone=true;phase=3;path(2).classList.add('done');path(3).classList.add('active');step(3).classList.remove('locked');docNote.textContent='Dokumentationsfoto gespeichert.';flash.hidden=false;flash.classList.add('fire');setTimeout(()=>{flash.classList.remove('fire');flash.hidden=true;},420);hint.hidden=true;ghost.hidden=true;safe.hidden=true;scale.classList.add('placed');root.querySelector('#excavation-feedback').textContent='Dokumentation abgeschlossen. Jetzt sauber zwischen Beobachtung und Deutung unterscheiden.';});

function fieldMission(){
 const o=me(),g=researchGames[o.id],picked=Array.isArray(state.fieldAnswer)?state.fieldAnswer:[],isArray=['pair','sort','perspective'].includes(g.kind);
 let activity='';
 if(g.kind==='sequence'||g.kind==='order'){
  const expected=g.steps.length,done=picked.length;
  activity=`<div class="research-steps" aria-label="Forschungsreihenfolge">${picked.map((v,i)=>`<div class="research-slot">${i+1}. ${esc(g.steps[v])}</div>`).join('')}${done<expected?`<div class="research-slot empty">Schritt ${done+1} auswählen</div>`:''}</div><div class="field-options">${g.steps.map((v,i)=>picked.includes(i)?'':`<button class="field-option" data-action="research-pick" data-index="${i}">${esc(v)} →</button>`).join('')}</div><button class="btn btn-outline" data-action="research-clear">Reihenfolge zurücksetzen</button>`;
 }else if(g.kind==='ratio'){
  const val=typeof state.fieldAnswer==='number'?state.fieldAnswer:3;
  activity=`<div class="research-ratio"><label for="ratio-choice">Deine Schätzung: <strong>${val} Rosettenbreiten</strong></label><input id="ratio-choice" type="range" min="1" max="8" step="1" value="${val}"/><div class="ratio-bars"><div>1-Euro-Münze <span style="width:100%"></span></div><div>Rosette <span style="width:${Math.round(100/val)}%"></span></div></div></div>`;
 }else{
  activity=`<p class="field-tip">${g.kind==='sort'?'Wähle genau drei Materialien.':'Wähle genau zwei Aussagen.'}</p><div class="field-options">${g.options.map((v,i)=>`<button class="field-option ${picked.includes(i)?'picked':''}" data-action="research-pick" data-index="${i}" aria-pressed="${picked.includes(i)}"><span>${picked.includes(i)?'✓':'+'}</span>${esc(v)}</button>`).join('')}</div>`;
 }
 const target=g.kind==='ratio'?Math.abs((state.fieldAnswer??3)-3)<=1:g.kind==='sequence'||g.kind==='order'?picked.length===g.steps.length&&picked.every((x,i)=>x===i):picked.length===g.correct.length&&g.correct.every(x=>picked.includes(x));
 const canCheck=g.kind==='ratio'||g.kind==='sequence'||g.kind==='order'?g.kind==='ratio'||picked.length===g.steps.length:picked.length===g.correct.length;
 return `${stationTop(o,2)}<section class="field-mission"><span class="kicker">04 / INTERAKTIVE FORSCHUNGSMISSION</span><h2>Sieben Objekte. <em>Sieben Aufgaben.</em></h2><p>Jede Vitrine erforschst du auf andere Weise. Die dokumentierten Originalfotos und der Met-Katalog bleiben unsere Quellen.</p><div class="field-layout"><div class="field-photo">${thumb(o,'large')}<p>Originalaufnahme · The Metropolitan Museum of Art · ${esc(o.inventory)} · Bei fehlendem Foto bitte eine Originalaufnahme importieren.</p><button class="btn btn-outline" data-action="next" data-to="detail">↖ Originalfoto untersuchen</button></div><div class="field-panel"><span class="kicker">${esc(g.tag)}</span><h3>${esc(g.title)}</h3><p>${esc(g.intro)}</p>${activity}${state.fieldChecked?`<div class="field-feedback" role="status"><strong>${target?'Gut untersucht!':'Eine wichtige Unterscheidung:'}</strong><p>${esc(g.note)}</p>${!target?'<p>Vergleiche deine Auswahl noch einmal mit der Erklärung.</p>':''}<small>Forschungsübung · Quellen und Deutungen getrennt</small></div><button class="btn btn-gold btn-wide" data-action="next" data-to="${state.shortMode?'shortfinish':'exercise'}">${state.shortMode?'Fundstück abschließen →':'Weiter zur Wissensfrage →'}</button>`:`<button class="btn btn-gold btn-wide" data-action="research-check" ${canCheck?'':'disabled'}>Ergebnis überprüfen →</button>`}</div></div></section></main>${footer()}`;
}
function challenge(){const o=me(),q=o.mission;return `${stationTop(o,2)}<section class="workbench-layout"><div class="workbench-art"><div class="workbench-header"><span class="kicker">UNTER DER LUPE</span>${zoomControls()}</div><div class="zoom-stage" data-pan="true">${thumb(o,'zoom')}</div><p class="image-foot">Mit + vergrößern · vergrößertes Bild mit dem Finger verschieben · Originalfoto; bei fehlender Datei Fotoimport verwenden</p><div class="museum-minilink"><a href="https://www.metmuseum.org/art/collection/search/${o.metId}" target="_blank" rel="noopener noreferrer">Objektkatalog des Met öffnen ↗</a></div></div><div class="workbench-task"><div class="task-top"><span class="kicker">02 / ${esc(q.eyebrow)}</span><span class="task-label">${q.kind==='multi'?'MEHRFACHAUSWAHL':'ENTSCHEIDUNGSFRAGE'}</span></div><h2>${esc(q.heading)}</h2><p class="task-question">${esc(q.prompt)}</p>${o.id==='rosette'?`<div class="size-diagram"><div><span class="diagram-coin">1 €</span><small>Münze · 23,25 mm</small></div><div><span class="diagram-piece">✦</span><small>Goldplättchen · 7,5 mm</small></div><span class="diagram-note">Maßstabsgetreues Verhältnis, keine Bildschirm-Echtgröße</span></div>`:''}<p class="task-hint">${q.kind==='multi'?`Wähle genau ${q.correct.length} Antworten aus.`:'Wähle eine Antwort aus.'}</p><div class="choices" role="group" aria-label="Antworten">${q.options.map((text,i)=>`<button class="choice ${state.selected.includes(i)?'chosen':''} ${state.checked && q.correct.includes(i)?'correct':''}" data-action="pick" data-index="${i}" ${state.checked?'disabled':''} aria-pressed="${state.selected.includes(i)}"><span class="choice-letter">${String.fromCharCode(65+i)}</span><span>${esc(text)}</span><span class="choice-tick">${state.selected.includes(i)?'✓':'＋'}</span></button>`).join('')}</div>${state.checked?`<div class="feedback ${equal(state.selected,q.correct)?'right':'learning'}" role="status"><strong>${equal(state.selected,q.correct)?'Gut beobachtet.':'Schau dir diesen Hinweis an.'}</strong><p>${esc(q.explain)}</p><small>Die Erklärung gilt unabhängig davon, welche Antwort du ausgewählt hast.</small></div><button class="btn btn-gold btn-wide" data-action="next" data-to="evidence">Zur Forschungsfrage <span>→</span></button>`:`<div class="task-buttons"><button class="btn btn-outline" data-action="hint">${state.showHint?'Hinweis ausblenden':'Objekthinweis anzeigen'}</button><button class="btn btn-gold" data-action="check" ${state.selected.length===0?'disabled':''}>Antwort prüfen →</button></div>${state.showHint?`<div class="light-hint">${esc(o.fact)}</div>`:''}`}</div></section></main>${footer()}`}
function equal(a,b){return a.length===b.length && b.every(x=>a.includes(x))}
function evidence(){const o=me();let opts=[{id:'documented',t:'Belegt',d:'Direkt am Objekt oder im Katalog dokumentiert'},{id:'inferred',t:'Gut begründet',d:'Eine Deutung mit nachvollziehbaren Hinweisen'},{id:'open',t:'Nicht belegt / offen',d:'Behauptung ohne sicheren Beweis oder noch ungeklärt'}];let pick=state.selected[0];return `${stationTop(o,3)}<section class="evidence-layout"><div class="evidence-art">${thumb(o,'evidence')}<div class="evidence-art-label">DIE FORSCHUNGSFRAGE</div></div><div class="evidence-content"><span class="kicker">03 / FORSCHUNGSWERKSTATT</span><h2>Wissen.<br><em>Oder Vermutung?</em></h2><p>Ordne die Aussage ein. Archäologie lebt davon, dass wir auch Grenzen unseres Wissens erkennen.</p><blockquote>„${esc(o.research.statement)}“</blockquote><div class="evidence-choices">${opts.map((e,i)=>`<button class="evidence-choice ${pick===i?'chosen':''}" data-action="pick" data-index="${i}" ${state.checked?'disabled':''} aria-pressed="${pick===i}"><span class="evidence-radio">${pick===i?'●':'○'}</span><span><strong>${e.t}</strong><small>${e.d}</small></span></button>`).join('')}</div>${state.checked?`<div class="feedback ${opts[pick]?.id===o.research.answer?'right':'learning'}"><strong>${opts[pick]?.id===o.research.answer?'Gute Einordnung!':'Das zeigt uns die Quellenlage:'}</strong><p>${esc(o.research.why)}</p></div><button class="btn btn-gold btn-wide" data-action="finish">Fundbericht ansehen <span>→</span></button>`:`<button class="btn btn-gold btn-wide" data-action="check" ${state.selected.length===0?'disabled':''}>Einordnung prüfen <span>→</span></button>`}</div></section></main>${footer()}`}
function report(){const o=me(),next=pack.objects.find(x=>!state.done.has(x.id));return `${stationTop(o,4)}<section class="report"><div class="report-seal"><span>✓</span><small>MISSION GESCHAFFT!</small></div><div class="finish-count">${state.done.size} von 7 Fundstücken geschafft</div><span class="kicker">DEIN FORSCHUNGSBERICHT · ${o.n} / 07</span><h2>Stark! <em>Gut beobachtet.</em></h2><p class="report-intro">${esc(o.takeaway)}</p><div class="report-book"><div class="report-object">${thumb(o,'report')}<div><span class="kicker">OBJEKT</span><h3>${esc(o.short)}</h3><p>${esc(o.inventory)} · ${esc(o.era)}</p></div></div><div class="report-explain"><span class="kicker">DAS BLEIBT</span><p>${esc(o.fact)}</p><span class="report-source">Quelle: ${esc(o.museum)} · ${esc(o.inventory)}</span></div></div>${pilotEnabled?`<div class="pilot-feedback" id="pilot-feedback"><strong>War diese Station verständlich?</strong><p>Eine freiwillige anonyme Rückmeldung.</p><div><button data-action="pilot-feedback" data-value="klar">Ja</button><button data-action="pilot-feedback" data-value="teilweise">Teilweise</button><button data-action="pilot-feedback" data-value="unklar">Nein</button></div></div>`:``}<div class="report-actions"><button class="btn btn-outline" data-action="home">Zur Sammlung (${progress()})</button>${next?`<button class="btn btn-gold" data-action="open" data-id="${next.id}">Nächstes Fundstück <span>↗</span></button>`:`<button class="btn btn-gold" data-action="final">Sammlung abschließen <span>↗</span></button>`}</div><button class="subtle-link" data-action="about">Wissenschaftliche Quellen und Bildnachweise ansehen ↗</button></section></main>${footer()}`}
function finalPage(){return `${masthead()}<main class="main final-page"><div class="final-ornament">${ornament()}</div><span class="kicker">SIEBEN OBJEKTE · SIEBEN PERSPEKTIVEN</span><h1>DU HAST DIE <em>SPUREN</em><br>DER STEPPE GELESEN.</h1><p>Goldschmuck, Tiermotive und Pferdegeschirr zeigen Facetten des Lebens. Die Schwertscheide spricht von Kulturkontakten, die Bronze-Reiterfigur davon, wie Menschen andere sahen.</p><div class="final-three"><div><b>01</b><strong>Genau hinschauen</strong><span>Was zeigt uns das Objekt?</span></div><div><b>02</b><strong>Belege prüfen</strong><span>Woher stammt unser Wissen?</span></div><div><b>03</b><strong>Fragen offenlassen</strong><span>Was können wir nicht sicher sagen?</span></div></div><div class="final-sign">KONZEPT & ENTWICKLUNG <strong>${esc(museum.maker)}</strong></div><div class="final-buttons"><button class="btn btn-gold" data-action="home">Zur Sammlung zurück ↗</button><button class="btn btn-outline" data-action="restart">Neue Entdeckungsreise</button></div></main>${footer()}`}
function about(){return `${masthead()}<main class="main about-page"><nav class="breadcrumbs"><button data-action="home">← Zur Sammlung</button><span>/</span><b>IMPRESSUM & QUELLEN</b></nav><span class="kicker">ÜBER DIESE DIGITALE AUSSTELLUNG</span><h1>Gute Fragen.<br><em>Gute Quellen.</em></h1><div class="about-layout"><section><h2>Ein Spiel von ${esc(museum.maker)}</h2><p>Konzept, Entwicklung und digitale Gestaltung: <strong>${esc(museum.maker)}</strong>. Diese Anwendung ist ein eigenständiger Museumsprototyp und keine offizielle Produktion des Metropolitan Museum of Art.</p><p>${esc(museum.disclaimer)}</p><p>${esc(museum.research)}</p><h3>Besucher-Testmodus</h3><p>Eine optionale, ausschließlich lokale Testauswertung kann durch das Museum vor einem betreuten Pilotversuch aktiviert werden. Die Verwaltung erfolgt separat.</p><h3>Offline-Bildprüfung für dieses Gerät</h3><p>Der folgende Test zählt nur lokal gespeicherte Fotodateien und importierte Bilder – niemals Bilder, die bloß über das Internet geladen werden.</p><button type="button" class="btn btn-outline" data-action="photo-check">Sieben Originalfotos lokal prüfen</button><pre class="offline-result" id="offline-result" aria-live="polite">Noch nicht geprüft.</pre><h3>Bildnachweise und Offline-Modus</h3><p>Alle sieben Stationen sind für originale Met-Fotografien eingerichtet. Die Anwendung sucht zuerst die lokalen Dateien in assets/photos/ und nutzt bei Internetverbindung andernfalls den Met-Bildserver. Alle sieben Originalfotos sind in dieser Version lokal im Ordner assets/photos/ enthalten. Für den vollständig netzunabhängigen Betrieb die Anwendung über den mitgelieferten lokalen Server starten. Fehlt ein Bild, erscheint kein Ersatzobjekt.</p><h3>Originalfotografien für die Offline-Nutzung einrichten</h3><p>Wähle die passende Originaldatei aus dem Met-Objektkatalog. Die Auswahl bleibt lokal in diesem Browser gespeichert (IndexedDB); keine Besucherdateien werden übertragen.</p><div class="import-grid">${pack.objects.map(o=>`<label class="import-label">${esc(o.n)} · ${esc(o.short)}<input type="file" class="photo-import" data-id="${esc(o.id)}" accept="image/png,image/jpeg,image/webp"></label>`).join('')}</div><h3>Für Museen anpassbar</h3><p>In <code>pack.js</code> stehen Ausstellungsname, Urhebernennung, Objekttexte, Fragen, Bildpfade und Quellen. Die Fotografien können in <code>assets/photos/</code> gespeichert werden. Zusätzlich ist ein Fotoimport direkt am Tablet mit lokaler Browserspeicherung möglich. Bildmarker müssen vor dem Museumseinsatz am verwendeten Foto kalibriert und kuratorisch freigegeben werden.</p></section><section class="source-list"><h2>Objektquellen</h2>${pack.objects.map(o=>`<a href="https://www.metmuseum.org/art/collection/search/${o.metId}" target="_blank" rel="noopener noreferrer"><span>${o.n}</span><div><b>${esc(o.short)}</b><small>Met · ${esc(o.inventory)} · ${esc(o.kind)}</small></div><span>↗</span></a>`).join('')}<h2>Forschung</h2>${pack.sharedSources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><div><b>${esc(s.title)}</b><small>Externe wissenschaftliche Referenz</small></div><span>↗</span></a>`).join('')}</section></div><button class="btn btn-gold" data-action="home">Zur Sammlung zurück →</button></main>${footer()}`}
function render(){if(state.page!=='gallery' && !me() && !['about','final'].includes(state.page))state.page='gallery';root.innerHTML=({gallery,object:objectPage,excavation:excavationPage,detail:detailPage,compare:comparePage,fieldmission:fieldMission,exercise:challenge,evidence,report,about,final:finalPage}[state.page]||gallery)();if(state.page==='excavation')requestAnimationFrame(setupExcavation);document.title=`${state.page==='gallery'?'Spuren der Steppe':(me()?.short||'Digitale Sammlung')} · ${museum.maker}`;updateZoom();}
async function checkOfflinePhotos(){
 const status=document.querySelector('#offline-result');if(!status)return;
 status.textContent='Prüfung der sieben lokalen Originaldateien läuft …';
 let success=0;const lines=[];
 for (const o of pack.objects){
  const imported=!!localPhotos[o.id];
  const asset=await new Promise(resolve=>{const i=new Image();i.onload=()=>resolve({ok:true,w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>resolve({ok:false});i.src=o.imageLocal+'?check='+Date.now()});
  const found=imported||asset.ok;if(found)success++;
  const label=imported?'lokal im Browser importiert':asset.ok?`lokale Datei (${asset.w} × ${asset.h} px)`:'NICHT lokal vorhanden';
  lines.push(`${o.n} ${o.short}: ${label}`);
 }
 status.textContent=`${success}/7 Originalaufnahmen lokal verfügbar.\n`+lines.join('\n')+(success===7?'\nAlle sieben Fotos sind auf diesem Gerät lokal vorhanden.':'\nFür einen sicheren Offline-Betrieb die fehlenden Originale ergänzen.');
}
function updateZoom(){const w=document.querySelector('#touch-world');if(w){w.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.zoom})`;const canvas=document.querySelector('#lab-canvas');if(canvas)canvas.style.setProperty('--inv-z',(1/state.zoom).toFixed(4));const readout=document.querySelector('#zoom-readout');if(readout)readout.textContent=state.zoom.toFixed(1)+'×';return;} const z=document.querySelector('.zoom-stage .art-frame');if(!z)return;let v=z.querySelectorAll('img');v.forEach(img=>{img.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.zoom})`});const lbl=document.querySelector('#zoom-readout');if(lbl)lbl.textContent=state.zoom.toFixed(1)+'×';}

 if(a==='pilot-show'&&state.page==='about'){showPilot=true;render();return;}

<script id="fundlabor-v84-js">
(()=>{
'use strict';
const items=[
 {id:'hirsch',title:'Goldhirsch',image:'assets/photos/hirsch.jpg',answer:'kleidung',evidence:'Im Met-Katalog als Kleidungsornament beschrieben. Die genaue Trageposition ist nicht dokumentiert.'},
 {id:'eber',title:'Eberbeschlag',image:'assets/photos/eber.jpg',answer:'pferd',evidence:'Im Met-Katalog als Verzierung für Pferdegeschirr oder Trense eingeordnet.'},
 {id:'greif',title:'Goldgreif',image:'assets/photos/greif.jpg',answer:'kleidung',evidence:'Das Schmuckstück hat eine Befestigungsöse und wird als Ornament eingeordnet.'},
 {id:'trense',title:'Trensenteil',image:'assets/photos/trense.jpg',answer:'pferd',evidence:'Im Museumskatalog als seitliches Trensenteil bezeichnet.'},
 {id:'rosette',title:'Mini-Goldstück',image:'assets/photos/rosette.jpg',answer:'kleidung',evidence:'Der Katalog beschreibt ein kleines Kleidungsornament; das Objekt ist nur etwa 7,5 mm breit.'}
];
let completed=new Set(),selected=null,drag=null;
const modal=()=>document.getElementById('fundlabor-modal');
function announce(msg,kind='info'){let el=document.getElementById('fl-feedback');if(el){el.textContent=msg;el.dataset.kind=kind;}}
function refresh(){
 const m=modal();if(!m)return;
 const n=completed.size;
 m.querySelector('#fl-progress').style.width=(n/5*100)+'%';
 m.querySelector('#fl-progress-text').textContent=n+' von 5 Funden zugeordnet';
 m.querySelectorAll('.fl-card').forEach(b=>{let done=completed.has(b.dataset.item);b.classList.toggle('finished',done);b.classList.toggle('selected',!done&&b.dataset.item===selected);b.setAttribute('aria-pressed',String(!done&&b.dataset.item===selected));b.disabled=done; if(done)b.querySelector('small').textContent='✓ Zugeordnet';});
 const done=m.querySelector('#fl-finish');done.hidden=n!==5;
 if(n===5)announce('Alle fünf Funde sind zugeordnet. Gut gemacht!','correct');
}
function place(group,id=selected){if(!id||completed.has(id))return;let item=items.find(x=>x.id===id);if(!item)return;
 if(group!==item.answer){announce('Noch nicht! Achte auf die dokumentierte Verwendung, nicht nur auf die Farbe oder das Material.','error');selected=id;refresh();return;}
 completed.add(id);selected=null;announce('✓ '+item.title+': '+item.evidence,'correct');refresh();
}
function close(){if(drag)drag=null;modal()?.remove();document.body.style.overflow='';}
function open(){close();completed=new Set();selected=null;let m=document.createElement('div');m.id='fundlabor-modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Fundlabor: Funde zuordnen');
 m.innerHTML=`<header class="fl-top"><strong>SPUREN DER STEPPE · FUNDLABOR</strong><button class="fl-close" type="button">✕ Spiel verlassen</button></header><main class="fl-wrap"><div class="fl-head"><span style="color:#e4c082;font-weight:700;letter-spacing:.13em">TOUCH-MISSION 02 · ORDNEN</span><h1>Wohin gehört der Fund?</h1><p>Ziehe die Fundstücke zu ihrer Verwendung. Auf dem Tablet kannst du auch <b>ein Foto antippen und danach ein Feld wählen</b>.</p></div><div class="fl-progress-text" id="fl-progress-text">0 von 5 Funden zugeordnet</div><div class="fl-progress"><div id="fl-progress"></div></div><section class="fl-targets" aria-label="Kategorien"><button class="fl-target" data-group="kleidung" type="button"><span style="font-size:34px">✦</span><b>Kleidungsornament</b><small>Schmuck und Verzierung an Kleidung</small></button><button class="fl-target" data-group="pferd" type="button"><span style="font-size:34px">♞</span><b>Pferdeausrüstung</b><small>Verzierungen und Teile des Zaumzeugs</small></button></section><section class="fl-cards" aria-label="Verschiebbare Fundfotos">${items.map(o=>`<button class="fl-card" type="button" data-item="${o.id}" aria-pressed="false"><img alt="Originalfoto: ${o.title}" src="${o.image}" draggable="false"><b>${o.title}</b><small>Ziehen oder antippen ↗</small></button>`).join('')}</section><div class="fl-feedback" id="fl-feedback" role="status" aria-live="polite">Beginne mit einem Fundfoto. Wähle dann eine der beiden Kategorien.</div><div class="fl-finish" id="fl-finish" hidden><div style="font-size:52px">✦</div><h2>Fundlabor geschafft!</h2><p>Du hast Fundstücke nach ihrer <b>dokumentierten Funktion</b> geordnet. Das ist mehr als bloßes Raten anhand des Fotos.</p><button type="button" class="fl-again">Noch einmal spielen ↻</button></div><div class="fl-footer"><button class="fl-reset" type="button">Zuordnung zurücksetzen ↻</button><button class="fl-close" type="button">Zur Sammlung zurück →</button></div><p class="fl-note"><strong>Archäologische Methode:</strong> Aussehen und Material liefern Hinweise, aber die Zuordnung stützt sich auch auf Form, Vergleichsfunde und Museumsdokumentation. Diese Aufgabe vereinfacht Kategorien für Lernzwecke. Es werden keine echten Fundzusammenhänge nachgestellt. Originalfotos: The Metropolitan Museum of Art. Vor Museumseinsatz fachlich prüfen.</p></main>`;
 document.body.append(m);document.body.style.overflow='hidden';
 m.querySelectorAll('.fl-close').forEach(b=>b.addEventListener('click',close));
 m.querySelectorAll('.fl-reset,.fl-again').forEach(b=>b.addEventListener('click',()=>{completed.clear();selected=null;announce('Neu gestartet. Wähle einen Fund.');refresh();}));
 m.querySelectorAll('.fl-target').forEach(b=>b.addEventListener('click',()=>place(b.dataset.group)));
 m.querySelectorAll('.fl-card').forEach(b=>{
  b.addEventListener('click',()=>{if(completed.has(b.dataset.item))return;selected=b.dataset.item;announce('Gewählt: '+items.find(x=>x.id===selected).title+'. Tippe auf eine Kategorie.');refresh();});
  b.addEventListener('pointerdown',e=>{if(completed.has(b.dataset.item)||e.pointerType==='mouse'&&e.button!==0)return;drag={id:b.dataset.item,startX:e.clientX,startY:e.clientY,active:false,pointerId:e.pointerId};});
  b.addEventListener('pointermove',e=>{if(!drag||drag.pointerId!==e.pointerId)return; if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>12){drag.active=true;selected=drag.id;b.classList.add('dragging');let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.fl-target');m.querySelectorAll('.fl-target').forEach(t=>t.classList.toggle('active',t===target));}});
  b.addEventListener('pointerup',e=>{if(!drag||drag.pointerId!==e.pointerId)return;let wasDragged=drag.active;let id=drag.id;drag=null;b.classList.remove('dragging');m.querySelectorAll('.fl-target').forEach(t=>t.classList.remove('active'));if(wasDragged){let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.fl-target');if(target){selected=id;place(target.dataset.group,id);}else {selected=id;announce('Foto gewählt. Tippe jetzt auf eine Kategorie.');refresh();}}});
  b.addEventListener('pointercancel',()=>{drag=null;b.classList.remove('dragging')});
 });
 document.addEventListener('keydown',onEscape,{once:false});
 function onEscape(e){if(e.key==='Escape'){document.removeEventListener('keydown',onEscape);close();}}

let pct=Math.round(cells.reduce((a,b)=>a+b,0)/cells.length*100);$('#j87-pct').textContent=pct+' % sichtbar';$('#j87-fill').style.width=pct+'%';if(!brush)rough=true;if(pct>18&&!brush)$('#j87-message').textContent='Gut! Wechsle jetzt zum Pinsel.';if(pct>=50&&rough&&brush){painted=true;$('#j87-message').textContent='Fund digital freigelegt. Als Nächstes dokumentieren.';$('#j87-next').disabled=false;}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;canvas.setPointerCapture(e.pointerId);erase(e)});canvas.addEventListener('pointermove',e=>{if(pointer===e.pointerId)erase(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,e=>{if(pointer===e.pointerId)pointer=null}));$('#j87-next').onclick=()=>{if(painted)next()};}
function drawDocument(){shell(`<h1>2. Fundposition dokumentieren</h1><p class="j87-lead">Bevor man aus Fundmaterial Schlüsse zieht, muss seine Lage festgehalten werden. Das Raster ist ein <strong>fiktiver Übungsplan</strong>, kein historischer Befund des gewählten Museumsobjekts.</p><div class="j87-columns"><div class="j87-plan" id="j87-plan">${Array.from({length:16},(_,i)=>`<span>${'ABCD'[i%4]}${Math.floor(i/4)+1}</span>`).join('')}<button class="j87-pin" id="j87-pin" type="button" style="left:48%;top:47%" aria-label="Fundmarker verschieben">✦</button></div><div class="j87-inspector"><h2>Position sichern</h2><p>Ziehe den Marker an eine Stelle im Raster. Oder tippe erst den Marker und dann ein Rasterfeld an.</p><div class="j87-note" id="j87-coord">Noch keine Position dokumentiert.</div><button class="j87-main" id="j87-save">Fundposition dokumentieren</button><button class="j87-main" id="j87-next" disabled>Weiter zum Originalfoto →</button></div></div><p class="j87-source">Methode: Lagebeschreibung und Fundkontext sind wichtige Daten; das Spiel verwendet ausschließlich erfundene Koordinaten.</p>`);
let plan=$('#j87-plan'),pin=$('#j87-pin'),drag=null,moved=false;function set(x,y){x=Math.max(8,Math.min(92,x));y=Math.max(8,Math.min(92,y));pin.style.left=x+'%';pin.style.top=y+'%';marks.pos='ABCD'[Math.min(3,Math.floor(x/25))]+(Math.min(3,Math.floor(y/25))+1);marks.saved=null;$('#j87-next').disabled=true;$('#j87-coord').textContent='Position ausgewählt: Feld '+marks.pos+' (noch nicht dokumentiert).';}
pin.addEventListener('pointerdown',e=>{e.preventDefault();drag=e.pointerId;moved=false;pin.setPointerCapture(e.pointerId)});pin.addEventListener('pointermove',e=>{if(drag!==e.pointerId)return;moved=true;let r=plan.getBoundingClientRect();set((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pin.addEventListener(ev,e=>{if(drag===e.pointerId)drag=null}));plan.addEventListener('click',e=>{if(e.target===pin)return;let r=plan.getBoundingClientRect();set((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)});$('#j87-save').onclick=()=>{if(!marks.pos)set(48,47);marks.saved=marks.pos;$('#j87-coord').textContent='✓ Übungsposition '+marks.saved+' dokumentiert.';$('#j87-next').disabled=false};$('#j87-next').onclick=()=>{if(marks.saved)next()};}
function drawStudy(){const task=research90[chosenObject.id],mission=touchMissions92[chosenObject.id];shell(`<h1>3. Beobachten & prüfen</h1><p class="j87-lead">${mission.look} Nutze zwei Finger oder die Zoom-Tasten. Danach beantworte die Frage zum Objekt.</p><div class="j87-columns"><div><div class="j88-photo-frame" id="j88-photo-frame"><img class="j87-photo" id="j88-photo" src="${imageSrc()}" alt="${objectName()}, Metropolitan Museum of Art" draggable="false"></div><div class="j91-markstatus" id="j91-markstatus" role="status">${mission.look}</div><p class="j93-caption">Suchspiel 9.3 · Markiere das gesuchte Detail. Zielbereiche sind vorläufig kalibriert und noch nicht kuratorisch geprüft.</p><button type="button" class="j93-help" id="j93-help">Hinweis anzeigen</button><button type="button" class="j93-help" id="j94-show-target">Zielbereich kontrollieren</button><div class="j88-loupe-tools"><button type="button" id="j88-minus">−</button><span id="j88-zoom-text">1,0×</span><button type="button" id="j88-plus">+</button><button type="button" id="j88-reset">Ansicht zurücksetzen ⟲</button></div><p class="j87-source">Metropolitan Museum of Art · Inventarnummer ${chosenObject.inv} · Originalfotografie.</p></div><div class="j87-inspector"><div class="j92-method"><strong>Forschungsmethode:</strong> ${mission.method}</div><h2>${task.question}</h2><div class="j87-question"><p class="j91-prompt" id="j91-prompt">Erst eine Stelle im Foto markieren – dann deine Antwort wählen.</p><button id="j87-good" disabled>${task.choices[0]}</button><button id="j87-bad" disabled>${task.choices[1]}</button></div><div class="j87-status" id="j87-feedback" role="status"></div><button class="j87-main" id="j87-next" disabled>Forschungsbericht erstellen →</button></div></div>`);$('#j87-good').onclick=()=>{$('#j87-feedback').textContent='Richtig! '+task.explain;$('#j87-next').disabled=false};$('#j87-bad').onclick=()=>{$('#j87-feedback').textContent='Nicht ganz. '+task.explain};$('#j87-next').onclick=()=>next();setupTouchLupe();}
function setupTouchLupe(){
 const frame=$('#j88-photo-frame'),img=$('#j88-photo'),label=$('#j88-zoom-text');if(!frame||!img)return;
 let z=1,x=0,y=0;const fingers=new Map();let start=null;let startPoint=null;let marked=false;let misses=0;const spots=window.SKYTHEN_DETAILS?.[chosenObject.id]?.spots||[],goal=spots[0]||{x:50,y:50,label:'Merkmal'};const checkTarget=$('#j94-show-target');if(checkTarget)checkTarget.onclick=()=>{const old=frame.querySelector('.j94-target');if(old){old.remove();checkTarget.textContent='Zielbereich kontrollieren';return;}const t=document.createElement('span');t.className='j94-target';placeGuide(t);t.title='Vorläufiger Zielbereich: '+goal.label;frame.appendChild(t);checkTarget.textContent='Zielbereich ausblenden';};const help=$('#j93-help');if(help)help.onclick=()=>{$('#j91-markstatus').textContent='Hinweis: '+goal.label+' – suche ungefähr im markierten Bereich des Originalfotos.';let guide=frame.querySelector('.j93-guide');if(!guide){guide=document.createElement('span');guide.className='j93-guide';frame.appendChild(guide);}placeGuide(guide);};const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
 function placeGuide(el){const w=frame.clientWidth,h=frame.clientHeight,nw=img.naturalWidth||w,nh=img.naturalHeight||h,scale=Math.min(w/nw,h/nh),fw=nw*scale,fh=nh*scale;el.style.left=((w-fw)/2+fw*goal.x/100)/w*100+'%';el.style.top=((h-fh)/2+fh*goal.y/100)/h*100+'%';}
 function apply(){z=clamp(z,1,4);const w=frame.clientWidth,h=frame.clientHeight;x=clamp(x,-w*(z-1)/2,w*(z-1)/2);y=clamp(y,-h*(z-1)/2,h*(z-1)/2);img.style.transform='translate('+x+'px,'+y+'px) scale('+z+')';label.textContent=z.toFixed(1).replace('.',',')+'×';}
 function zoomTo(v){z=v;if(z<=1){z=1;x=0;y=0;}apply();}
 $('#j88-minus').onclick=()=>zoomTo(z-.3);$('#j88-plus').onclick=()=>zoomTo(z+.3);$('#j88-reset').onclick=()=>zoomTo(1);
 function metrics(){let a=[...fingers.values()];return {mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2,dist:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}}
 frame.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();frame.setPointerCapture(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===2){let m=metrics();start={mode:'pinch',dist:m.dist,z,x,y,mx:m.mx,my:m.my};}else if(fingers.size===1)start={mode:'pan',x,y,px:e.clientX,py:e.clientY};});
 frame.addEventListener('pointermove',e=>{if(!fingers.has(e.pointerId))return;e.preventDefault();fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===2){if(start?.mode!=='pinch'){let m=metrics();start={mode:'pinch',dist:m.dist,z,x,y,mx:m.mx,my:m.my};}let m=metrics();z=clamp(start.z*(m.dist/Math.max(10,start.dist)),1,4);x=start.x+(m.mx-start.mx);y=start.y+(m.my-start.my);apply();}else if(fingers.size===1&&start?.mode==='pan'){x=start.x+(e.clientX-start.px);y=start.y+(e.clientY-start.py);apply();}});
 function finish(e){if(!fingers.has(e.pointerId))return;fingers.delete(e.pointerId);if(fingers.size===1){let v=[...fingers.values()][0];start={mode:'pan',x,y,px:v.x,py:v.y};}else start=null;}
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])frame.addEventListener(ev,finish);
 frame.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(fingers.size===1)startPoint={id:e.pointerId,x:e.clientX,y:e.clientY};else startPoint=null;});
 frame.addEventListener('pointermove',e=>{if(startPoint?.id===e.pointerId&&Math.hypot(e.clientX-startPoint.x,e.clientY-startPoint.y)>12)startPoint=null;});
 frame.addEventListener('pointerup',e=>{if(!startPoint||startPoint.id!==e.pointerId)return;startPoint=null;const box=frame.getBoundingClientRect(),xx=Math.max(3,Math.min(97,(e.clientX-box.left)/box.width*100)),yy=Math.max(3,Math.min(97,(e.clientY-box.top)/box.height*100));let pin=frame.querySelector('.j91-pin');if(!pin){pin=document.createElement('span');pin.className='j91-pin';pin.setAttribute('aria-label','Markiertes Bilddetail');frame.appendChild(pin);}pin.style.left=xx+'%';pin.style.top=yy+'%';const px=(xx/100*box.width-box.width/2-x)/z+box.width/2,py=(yy/100*box.height-box.height/2-y)/z+box.height/2;const nativeW=img.naturalWidth||box.width,nativeH=img.naturalHeight||box.height,fit=Math.min(box.width/nativeW,box.height/nativeH),shownW=nativeW*fit,shownH=nativeH*fit;const ix=(px-(box.width-shownW)/2)/shownW*100,iy=(py-(box.height-shownH)/2)/shownH*100;const hit=Math.hypot(ix-goal.x,iy-goal.y)<=17;if(!hit){misses++;$('#j91-markstatus').textContent='Noch nicht im gesuchten Bereich. '+(misses>=2?'Tipp: Nutze „Hinweis anzeigen“ für eine Orientierung.':'Untersuche die Kontur genauer.');$('#j91-prompt').textContent='Gesuchtes Merkmal noch nicht entdeckt – probiere es erneut.';return;}marked=true;discoveredDetail94={object:chosenObject.id,label:goal.label,x:goal.x,y:goal.y};$('#j91-markstatus').textContent='Treffer: '+goal.label+'. '+touchMissions92[chosenObject.id].method;$('#j87-good').disabled=false;$('#j87-bad').disabled=false;$('#j91-prompt').textContent='Detail gefunden ✓ Jetzt kannst du antworten.';});
 frame.addEventListener('dblclick',()=>zoomTo(z>1?1:2));apply();
}
function drawReport(){shell(`<div class="j87-complete"><h1>Forschungsreise geschafft!</h1><p class="j90-mission">Eigene Forschungsfrage zu ${objectName()} beantwortet.</p><p class="j87-lead">Du hast ein Fundstück digital freigelegt, eine Übungsposition dokumentiert und eine wissenschaftlich nachvollziehbare Beobachtung ausgewählt.</p><div class="j87-paper"><h3>Dein Forschungsprotokoll</h3><p><strong>Objekt:</strong> ${objectName()} (Met ${chosenObject.inv})</p><p><strong>Freilegung:</strong> Digitale Simulation durchgeführt</p><p><strong>Übungsraster:</strong> ${marks.saved||'nicht dokumentiert'} (frei erfunden, keine echte Fundlage)</p><p><strong>Entdecktes Bilddetail:</strong> ${discoveredDetail94?.object===chosenObject.id?discoveredDetail94.label:'nicht dokumentiert'} (Suchbereich vorläufig kalibriert)</p><p><strong>Erkenntnis:</strong> ${research90[chosenObject.id].takeaway}</p></div><p class="j87-source">Bild: The Metropolitan Museum of Art. Konzept & Entwicklung: Paul Fürst. Lernsimulation, kein authentischer Grabungsbefund.</p><div class="j87-controlrow"><button class="j87-subtle" id="j87-again">↻ Anderen Fund wählen</button><button class="j87-subtle" id="j87-end">Zur Sammlung</button></div></div>`);$('#j87-again').onclick=open;$('#j87-end').onclick=close;}
